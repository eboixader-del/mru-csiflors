a",short:"Un m\xF3vil",subtitle:"Un solo m\xF3vil con MRU",color:"#22d3ee",text:"text-cyan-300",chip:"bg-cyan-950/60 text-cyan-300 border border-cyan-800",box:"bg-cyan-950/30 border-cyan-800/60",btn:"bg-cyan-600 hover:bg-cyan-500 shadow-cyan-900/50",intro:"El sospechoso huye solo. En cada tramo se mueve en l\xEDnea recta y a velocidad constante: es un Movimiento Rectil\xEDneo Uniforme. Tendr\xE1s que calcular tiempos, distancias o velocidades.",formulas:["v = d / t","d = v \xB7 t","t = d / v"],tip:"Cuidado con las unidades: si la velocidad est\xE1 en km/h, el tiempo debe ir en horas (minutos \xF7 60)."},{id:2,name:"La persecuci\xF3n",short:"Alcance",subtitle:"Problemas de alcance",color:"#f59e0b",text:"text-amber-300",chip:"bg-amber-950/60 text-amber-300 border border-amber-800",box:"bg-amber-950/30 border-amber-800/60",btn:"bg-amber-600 hover:bg-amber-500 shadow-amber-900/50",intro:"Entra en juego la polic\xEDa. Ahora hay DOS m\xF3viles que van en el MISMO sentido: el sospechoso va delante y el perseguidor, m\xE1s r\xE1pido, va detr\xE1s. La distancia entre ellos se reduce a la velocidad relativa v\u2081 \u2212 v\u2082.",formulas:["t alcance = d\u2080 / (v\u2081 \u2212 v\u2082)","x = v\u2081 \xB7 t"],tip:"d\u2080 es la ventaja inicial. Si salen a horas distintas, calcula primero cu\xE1ntos km ha recorrido el primero antes de que salga el segundo."},{id:3,name:"El cerco",short:"Cruce",subtitle:"Problemas de cruce (encuentro)",color:"#e879f9",text:"text-fuchsia-300",chip:"bg-fuchsia-950/60 text-fuchsia-300 border border-fuchsia-800",box:"bg-fuchsia-950/30 border-fuchsia-800/60",btn:"bg-fuchsia-600 hover:bg-fuchsia-500 shadow-fuchsia-900/50",intro:"Hay que cortarle el paso. Los dos m\xF3viles van en sentidos OPUESTOS, uno hacia el otro. La distancia que los separa se reduce a la suma de sus velocidades: v\u2081 + v\u2082.",formulas:["t cruce = d / (v\u2081 + v\u2082)","x = v\u2081 \xB7 t"],tip:"x es la distancia al punto de salida del primer m\xF3vil. Si uno sale m\xE1s tarde, calcula antes la distancia que los separa en ese momento."}],Qe="#ef4444",$t="#3b82f6",fe=[{id:"1.1",phase:1,from:"vilareal",to:"burriana",time:"08:15",title:"El robo en la Fundaci\xF3n Flors",description:"\xA1Atenci\xF3n agentes de CSI Flors! Un sospechoso ha robado un microscopio muy valioso del laboratorio hoy a las 08:15. Ha huido hacia el puerto de Burriana por carreteras secundarias. La distancia es de 12 km y las c\xE1maras de tr\xE1fico indican que circulaba a una velocidad constante de 72 km/h.",question:"\xBFCu\xE1ntos MINUTOS tard\xF3 en llegar a Burriana?",hint:"Calcula primero el tiempo en horas (t = d / v). Luego multiplica el resultado por 60 para pasarlo a minutos.",answer:10,unit:"minutos",outcome:"t = 12 / 72 = 0,1667 h = 10 min. Lleg\xF3 al puerto de Burriana a las 08:25.",mobiles:[{label:"Sospechoso",emoji:"\u{1F697}",color:Qe,start:0,end:1}]},{id:"1.2",phase:1,from:"burriana",to:"castellon",time:"08:25",title:"Cambio de veh\xEDculo",description:"En el puerto de Burriana abandon\xF3 el coche y rob\xF3 una moto para pasar desapercibido, poniendo rumbo a Castell\xF3n. Sabemos que tard\xF3 15 minutos exactos (0,25 horas) viajando a una velocidad constante de 80 km/h.",question:"\xBFQu\xE9 DISTANCIA (en km) recorri\xF3 con la moto?",hint:"Distancia (d) = Velocidad (v) \xD7 Tiempo (t). \xA1Recuerda usar el tiempo en horas (0,25)!",answer:20,unit:"km",outcome:"d = 80 \xB7 0,25 = 20 km. A las 08:40 una patrulla lo ve entrar en Castell\xF3n.",mobiles:[{label:"Sospechoso",emoji:"\u{1F3CD}\uFE0F",color:Qe,start:0,end:1}]},{id:"1.3",phase:1,from:"castellon",to:"benicassim",time:"08:40",title:"Huida por la costa",description:"Al verse descubierto en Castell\xF3n, tom\xF3 la carretera de la costa hacia Benic\xE0ssim. La distancia es de 15 km y tard\xF3 exactamente 10 minutos (es decir, 1/6 de hora).",question:"\xBFA qu\xE9 VELOCIDAD (en km/h) iba por la carretera de la costa?",hint:"Velocidad (v) = Distancia (d) / Tiempo (t). Dividir entre 1/6 es lo mismo que multiplicar la distancia por 6.",answer:90,unit:"km/h",outcome:"v = 15 / (1/6) = 90 km/h. A las 08:50 deja atr\xE1s Benic\xE0ssim.",mobiles:[{label:"Sospechoso",emoji:"\u{1F3CD}\uFE0F",color:Qe,start:0,end:1}]},{id:"1.4",phase:1,from:"benicassim",to:"sagunto",time:"08:50",title:"Entrada en la autopista",description:"Se ha incorporado a la autopista AP-7 en direcci\xF3n sur hacia Sagunto. Pisa el acelerador a fondo y mantiene una velocidad constante de 120 km/h. La distancia hasta el peaje de Sagunto es de 60 km.",question:"\xBFCu\xE1ntos MINUTOS tard\xF3 en llegar al peaje de Sagunto?",hint:"Calcula primero el tiempo en horas (t = d / v). Luego multiplica por 60.",answer:30,unit:"minutos",outcome:"t = 60 / 120 = 0,5 h = 30 min. A las 09:20 cruza el peaje de Sagunto.",mobiles:[{label:"Sospechoso",emoji:"\u{1F3CD}\uFE0F",color:Qe,start:0,end:1}]},{id:"1.5",phase:1,from:"sagunto",to:"valencia",time:"09:20",title:"Tr\xE1fico de capital",description:"Ahora se dirige a Valencia, a 30 km. Debido al tr\xE1fico de entrada a la ciudad, sabemos que tard\xF3 exactamente 30 minutos (0,5 horas) en llegar a la estaci\xF3n.",question:"\xBFCu\xE1l fue su VELOCIDAD media (en km/h) en este tramo?",hint:"Velocidad (v) = Distancia (d) / Tiempo (t). Usa el tiempo en horas (0,5).",answer:60,unit:"km/h",outcome:"v = 30 / 0,5 = 60 km/h. Llega a Valencia a las 09:50... \xA1pero ahora ya tenemos refuerzos en camino!",mobiles:[{label:"Sospechoso",emoji:"\u{1F3CD}\uFE0F",color:Qe,start:0,end:1}]},{id:"2.1",phase:2,from:"valencia",to:"alicante",time:"10:00",title:"Persecuci\xF3n en la autov\xEDa",description:"A las 10:00 el sospechoso sale de Valencia en un coche robado por la autov\xEDa hacia Alicante (a 160 km), a 90 km/h constantes. Una patrulla de la Guardia Civil sale del mismo punto 20 minutos despu\xE9s (a las 10:20), por la misma autov\xEDa y en el mismo sentido, a 120 km/h.",question:"\xBFA cu\xE1ntos KIL\xD3METROS de Valencia lo alcanzar\xE1 la patrulla?",hint:"1) Ventaja de
